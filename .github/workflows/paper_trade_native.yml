name: Paper trade - native crypto (Unyil 2.0)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: paper-trade-native
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        coin: [btc, eth]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Activate Unyil 2.0 (NATIVE_CRYPTO family)
        run: cp strategy_unyil2.py strategy.py

      - name: Run one paper-trading tick
        env:
          COIN: ${{ matrix.coin }}
          STATE_PATH: state_${{ matrix.coin }}.json
          STARTING_IDR: "250000"
          EXECUTE: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 live_runner.py

      - name: Commit updated state back to the repo
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          git add "state_${{ matrix.coin }}.json"
          git diff --staged --quiet || git commit -m "state: ${{ matrix.coin }} tick [skip ci]"

          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && break
            echo "Push attempt $attempt failed (likely a race with another job) -- retrying..."
            sleep $((RANDOM % 5 + 2))
          done
