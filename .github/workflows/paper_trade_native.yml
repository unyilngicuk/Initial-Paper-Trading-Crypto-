name: Paper trade - native crypto (Unyil 2.0)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: paper-trade-native
  cancel-in-progress: false

# Without this, the built-in GITHUB_TOKEN defaults to read-only, and the
# "commit state back to the repo" step fails with a permissions error
# (git exit code 128) the moment it tries to push. This grants exactly
# the write access needed for that, nothing more.
permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # a problem with one asset shouldn't cancel the sibling's tick
      max-parallel: 1
      matrix:
        coin: [btc, eth]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Activate Unyil 2.0 (NATIVE_CRYPTO family)
        run: cp strategy_unyil2.py strategy.py

      - name: Run one paper-trading tick
        env:
          COIN: ${{ matrix.coin }}
          STATE_PATH: state_${{ matrix.coin }}.json
          STARTING_IDR: "250000"
          EXECUTE: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 live_runner.py

      - name: Commit updated state back to the repo
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          git add "state_${{ matrix.coin }}.json"
          git diff --staged --quiet || git commit -m "state: ${{ matrix.coin }} tick [skip ci]"
          git pull --rebase --autostash
          git push
