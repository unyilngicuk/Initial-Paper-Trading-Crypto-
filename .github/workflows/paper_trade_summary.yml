name: Paper trade - daily portfolio summary

on:
  schedule:
    - cron: "0 0 * * *"    # 07:00 WIB (Jakarta, UTC+7)
    - cron: "0 12 * * *"   # 19:00 WIB (Jakarta, UTC+7)
  workflow_dispatch: {}

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send portfolio summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 paper_trading_summary.py
